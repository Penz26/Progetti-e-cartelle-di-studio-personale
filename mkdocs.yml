site_name: Documentazione di Manuel
site_description: Il mio archivio personale di appunti su Obsidian.
theme:
    name: readthedocs
    language: it
    palette:
        # Modalità chiara/scura automatica o commutabile
        - scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-7
              name: Passa alla modalità scura
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-4
              name: Passa alla modalità chiara

    # Funzionalità Extra per l'interfaccia
    features:
        - navigation.tabs # Sposta il menu principale in alto
        - navigation.sections # Rende le sezioni cliccabili e ordinate
        - navigation.expand # Espande i menu automaticamente
        - navigation.top # Aggiunge il tasto "Torna su"
        - search.suggest # Suggerimenti durante la ricerca
        - search.highlight # Evidenzia i risultati della ricerca
        - content.code.copy # Aggiunge il tasto copia ai blocchi di codice
plugins:
    - search
    - callouts
markdown_extensions:
    # Supporto per i callout / box di avviso
    - admonition
    - pymdownx.details # Supporta i callout comprimibili (> [!NOTE]-)
    - pymdownx.superfences: # Supporta blocchi di codice annidati e Mermaid
          custom_fences:
              - name: mermaid
                class: mermaid
                format:
                    !!python/name:pymdownx.superfences.fence_code_format # Evidenziazione sintattica avanzata per il codice

    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    # Checklist e checkbox stile Obsidian (- [x])
    - pymdownx.tasklist:
          custom_checkbox: true
    # Tabelle avanzate, emoji e tab di codice
    - tables
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg

